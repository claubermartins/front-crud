name: CI Workflow for Angular

# Definindo os eventos que disparam o workflow
on:
  push:
    branches:
      - test-prod  # Ações ocorrerão apenas quando houver push na branch "test-prod"
  pull_request:
    branches:
      - test-prod  # O workflow também será executado em PRs para a branch "test-prod"

jobs:
  start:
    runs-on: ubuntu-latest  # Runner do GitHub que usará a última versão estável do Ubuntu

    steps:
      # Passo 1: Verificar o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # Passo 2: Configurar o Node.js e o ambiente do Angular
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'  # Usando a versão do Node.js compatível com o Angular

      # Passo 3: Instalar as dependências do projeto
      - name: Install dependencies
        run: npm install

      # Passo 4: Rodar o servidor de desenvolvimento
      - name: Run Angular development server
        run: npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.js
        # "--host 0.0.0.0" permite o acesso externo ao servidor, caso necessário
